{
  "version": 2,
  "models": [
    {
      "name": "stg_transactions",
      "description": "Одна строка на исходную транзакцию. Дубликаты не удаляются: надёжного transaction_id нет; ошибки выявляются тестами.",
      "columns": [
        {
          "name": "transaction_time",
          "description": "Время в часовом поясе исходного ClickHouse; преобразования зоны нет.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "merchant",
          "description": "Нормализованное имя мерчанта.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "category",
          "description": "Категория в нижнем регистре.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "amount",
          "description": "Сумма в единицах исходного датасета.",
          "tests": [
            "not_null",
            {
              "dbt_expectations.expect_column_values_to_be_between": {
                "arguments": {
                  "min_value": 0
                }
              }
            }
          ]
        },
        {
          "name": "state",
          "description": "Код штата; допускается DC.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "gender",
          "description": "Пол из исходных данных.",
          "tests": [
            "not_null",
            {
              "accepted_values": {
                "arguments": {
                  "values": [
                    "M",
                    "F"
                  ],
                  "quote": true
                }
              }
            }
          ]
        },
        {
          "name": "is_fraud",
          "description": "Разметка мошенничества: 1 = фрод.",
          "tests": [
            "not_null",
            {
              "accepted_values": {
                "arguments": {
                  "values": [
                    0,
                    1
                  ],
                  "quote": false
                }
              }
            }
          ]
        },
        {
          "name": "lat",
          "description": "Широта клиента.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "lon",
          "description": "Долгота клиента.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "merchant_lat",
          "description": "Широта мерчанта.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "merchant_lon",
          "description": "Долгота мерчанта.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "customer_id",
          "description": "Прокси клиента: хеш имени, фамилии и координат; не гарантирует идентичность человека.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "transaction_date",
          "description": "Дата транзакции.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "transaction_hour",
          "description": "Час 0–23.",
          "tests": [
            "not_null"
          ]
        },
        {
          "name": "day_of_week",
          "description": "ISO день недели: понедельник 1, воскресенье 7.",
          "tests": [
            "not_null",
            {
              "accepted_values": {
                "arguments": {
                  "values": [
                    1,
                    2,
                    3,
                    4,
                    5,
                    6,
                    7
                  ],
                  "quote": false
                }
              }
            }
          ]
        },
        {
          "name": "amount_bucket",
          "description": "SMALL <100; MEDIUM [100,1000); LARGE >=1000.",
          "tests": [
            "not_null",
            {
              "accepted_values": {
                "arguments": {
                  "values": [
                    "SMALL",
                    "MEDIUM",
                    "LARGE"
                  ],
                  "quote": true
                }
              }
            }
          ]
        }
      ],
      "tests": []
    },
